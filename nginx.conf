server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # main.dart.js 未压缩是 3 MB。nginx 官方 image 预设没开 gzip，
    # 自架这条路线等于整包原始大小传给使用者（Cloudflare Pages 那条会自动压）。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # 基本安全标头（CSP 故意不设，Flutter web + CanvasKit + Firebase 容易误挡整站）
    # nginx 的 add_header 继承在 location 自己有 add_header 时会失效，
    # 因此 HTML-serving location 内也重复一份
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 入口档与 Service Worker 不可长快取，避免卡在旧版
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires -1;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /cache_sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 没有这条 exact match 的话会落到下面的 \.js$ 规则吃到 expires 6M，
    # 推播 SW 就会卡在半年前的版本（web/_headers 那边本来就有列，两边要一致）
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /assets/AssetManifest.bin.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /assets/FontManifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Flutter web 的产物几乎都「不带 hash」：URL 固定，内容每次 build 都可能变。
    # 这类路径绝对不能吃到下面 \.js$ 的 expires 6M，否则浏览器的 HTTP cache 会
    # 在部署之后继续端出旧 bytes —— 连 service worker 自己 fetch 回填时拿到的
    # 都是旧的，等于新版 SW 把旧资产再快取一次，使用者卡在旧版半年。
    #
    #   /canvaskit/  升 Flutter 才会变。旧的 canvaskit.js 配新的 canvaskit.wasm
    #                版本对不起来就是白画面（.wasm 不在那条 regex 里，两者失效
    #                时机原本就不一致）。失效交给 cache_sw.js 的 vendor cache 管。
    #   /assets/     每次 deploy 都可能变（图片、字型、AssetManifest）。
    #
    # 两者都改成只做 revalidate：Cloudflare Pages 对这些路径的预设行为就是这样，
    # 两条部署路径要一致。SW 命中时根本不会发请求，revalidate 的成本是每次
    # 部署每个档案一次 304，很便宜。
    # ^~ 让这两条前缀赢过下面的 regex location。
    location ^~ /canvaskit/ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location ^~ /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 处理静态资源缓存（favicon、icons/ 这类真正不会变的才适用 6M）
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # This image is static; do not answer API requests with the SPA HTML.
    location ^~ /api/ {
        default_type application/json;
        return 403 '{"error":"此部署未启用伺服器整合功能"}';
    }

    # SPA 路由核心配置：任何找不到的路径都导向 index.html
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # 错误页面处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
