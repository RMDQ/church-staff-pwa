name: Deploy Flutter PWA
on:
  push:
    branches: [ main, dev ] # 当你 push 到 main 或 dev 时会触发
  workflow_dispatch: # 允许手动触发

env:
  # 同时给 flutter-action 与 cache_sw.js 的 VENDOR_VERSION 使用。
  # 改这个版本号 = 让使用者重新下载 canvaskit 引擎，其余 deploy 都不会。
  FLUTTER_VERSION: '3.41.0'

jobs:
  # Rules are deployed separately after operator review, but failing security
  # tests must still stop an application deployment.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - run: npm ci
        working-directory: firestore-tests

      - name: Test firestore.rules against the emulator
        run: npm test
        working-directory: firestore-tests

  # functions/ 写入 Google Calendar，是唯一一段跑在伺服器、拿得到 service
  # account 凭证的程式码。它跟前端在同一次 pages deploy 上去，所以这个 job
  # 刻意「挡」build-and-deploy —— 跟 firestore-rules 不同，那份规则要另外
  # firebase deploy，绑在一起只会平白拖慢前端部署。
  # 没有相依套件，所以不用 npm ci，也就没有 lockfile 可以 cache。
  functions-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test deployment operator scripts
        run: node --test scripts/*.test.mjs

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true
          no-project: true
          enable-cache: false

      - name: Test prompt publishing offline
        run: uv run --no-project --offline scripts/build_import_prompt_test.py

      - name: Test the calendar write API
        run: npm test
        working-directory: functions-tests

  # web/cache_sw.js 决定每个档案是从快取还是网路拿的，而它跟前端在同一次 pages
  # deploy 上去 —— 所以跟 functions-tests 一样挡 build-and-deploy。
  # 这个 job 存在的理由：version.json 被改成 network-first 过两次，两次都让个人页
  # 的「更新于」显示伺服器的部署时间而不是这台装置跑的版本，于是「他到底更新了
  # 没」变得无法从画面判断。坏掉的样子很安静，不测就看不出来。
  # 没有相依套件，所以不用 npm ci，也就没有 lockfile 可以 cache。
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test the service worker caching rules
        run: npm test
        working-directory: web-tests

  build-and-deploy:
    needs: [firestore-rules, functions-tests, web-tests]
    runs-on: ubuntu-latest
    steps:
      # 1. 检出程式码
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # A missing deployment config must never reset an existing church to the
      # neutral example. Settings are public, but may be supplied as a secret.
      - name: Prepare church deployment
        env:
          CHURCH_CONFIG_JSON: ${{ secrets.CHURCH_CONFIG_JSON || vars.CHURCH_CONFIG_JSON }}
          CHURCH_ASSETS_DIR: ${{ vars.CHURCH_ASSETS_DIR || 'web' }}
          CHURCH_ASSETS_GIT_REF: ${{ vars.CHURCH_ASSETS_GIT_REF }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { validateChurchConfig } from './worker/church_config.js';
          import { validateGitRef } from './scripts/restore-branding-from-git.mjs';
          const raw = process.env.CHURCH_CONFIG_JSON;
          if (!raw?.trim()) throw new Error('CHURCH_CONFIG_JSON secret/variable is required; copy config/church.example.json and configure your deployment.');
          validateChurchConfig(JSON.parse(raw));
          if (process.env.CHURCH_ASSETS_GIT_REF) validateGitRef(process.env.CHURCH_ASSETS_GIT_REF);
          if (!/^[a-z0-9][a-z0-9-]{0,57}$/.test(process.env.CLOUDFLARE_PAGES_PROJECT || '')) throw new Error('Set CLOUDFLARE_PAGES_PROJECT to your Pages project name.');
          if (!process.env.CLOUDFLARE_ACCOUNT_ID?.trim()) throw new Error('CLOUDFLARE_ACCOUNT_ID is required; set it in GitHub Secrets or Variables.');
          if (!process.env.CLOUDFLARE_API_TOKEN?.trim()) throw new Error('CLOUDFLARE_API_TOKEN is required; set it in GitHub Secrets.');
          fs.mkdirSync('.local', { recursive: true });
          fs.writeFileSync('.local/church.json', raw);
          JS
          if [[ -n "${CHURCH_ASSETS_GIT_REF:-}" ]]; then
            # The Node preflight above accepts only a complete commit SHA.
            # Restore from this repository's origin, never an arbitrary URL.
            CHURCH_ASSETS_GIT_REF="${CHURCH_ASSETS_GIT_REF,,}"
            git fetch --no-tags origin "$CHURCH_ASSETS_GIT_REF"
            node scripts/restore-branding-from-git.mjs \
              --config .local/church.json \
              --ref "$CHURCH_ASSETS_GIT_REF" \
              --out "$CHURCH_ASSETS_DIR"
          fi
          node scripts/prepare-deployment.mjs --config .local/church.json --assets "$CHURCH_ASSETS_DIR" --out .local/deployment

      # 2. 安装 Flutter 环境 (GitHub 支援，Cloudflare 不支援)
      # 版本固定：跟著 stable 浮动的话，某天 Flutter 发版就可能无预警 build 坏掉。
      # 升级时手动改这个号码，并在本机先跑过 flutter analyze / flutter test。
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 3. 取得 Flutter 套件
      - run: flutter pub get

      # 4. 品質關卡：format / analyze / test 沒過就不部署
      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
        # 用使用者手机的时区跑。行事历月份边界那组测试在 UTC 下新旧程式都会
        # 过（UTC 午夜刚好就是本地午夜），只有 +8 才抓得到「1 号清早的活动
        # 被归到上个月」那种 bug。
        env:
          TZ: Asia/Taipei

      # 5. 编译 Web (根据分支区分环境)
      - name: Build Web
        env:
          # Secrets (sensitive)
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          # Variables (non-sensitive, visible in repo settings) or Secrets
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID || vars.FIREBASE_MEASUREMENT_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID || vars.GOOGLE_CALENDAR_ID }}
        run: |
          set -eo pipefail
          if [ -z "$FCM_WEB_VAPID_KEY" ]; then
            echo "::warning::Missing FCM_WEB_VAPID_KEY secret. Web push token will not be generated."
          fi
          # Firebase.initializeApp 少任何一个必填栏位，App 在浏览器里就初始化
          # 不了 —— 而且 build 会成功，要部署完打开才发现。只挡 API key 不够。
          # 这份清单刻意与 Dockerfile 的检查一致：两条部署路径不能一边挡、
          # 一边放行，否则自架版与 CI 版会编出行为不同的产物。
          for required in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID \
                          FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing $required. Build would produce a non-functional app."
              exit 1
            fi
          done
          # Share the exact public Firebase values with the post-build finalizer.
          # Do not serialize server credentials or the rest of the environment.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const keys = ['FIREBASE_API_KEY', 'FIREBASE_AUTH_DOMAIN', 'FIREBASE_PROJECT_ID',
            'FIREBASE_STORAGE_BUCKET', 'FIREBASE_MESSAGING_SENDER_ID', 'FIREBASE_APP_ID',
            'FIREBASE_MEASUREMENT_ID'];
          fs.writeFileSync('.local/firebase-config.json', JSON.stringify(Object.fromEntries(
            keys.map((key) => [key, process.env[key] || '']),
          )));
          JS
          DART_DEFINES=(
            --dart-define-from-file=.local/deployment/dart-defines.json
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
            --dart-define=FIREBASE_MEASUREMENT_ID="$FIREBASE_MEASUREMENT_ID"
            --dart-define=GOOGLE_CALENDAR_API_KEY="$GOOGLE_CALENDAR_API_KEY"
            --dart-define=GOOGLE_CALENDAR_ID="$GOOGLE_CALENDAR_ID"
          )
          mkdir -p web
          # 这里刻意读 runner 内建的环境变数，而不是用 GitHub 的表示式插值。
          # 表示式是在 shell 启动「之前」把值直接贴成脚本文字，分支名带了 shell
          # 特殊字元（workflow_dispatch 可以从任意分支触发）就会被当成指令执行，
          # 带了引号也会把 JSON 写坏。
          #
          # 注：这段注解本身不能写出表示式的双大括号语法 —— GitHub 会扫描整个
          # 档案（包含 run: 区块内部）去解析表示式，空的一组就是语法错误，
          # 整份 workflow 会载入失败、零个 job 执行。
          cat <<EOF > web/version.json
          {
            "version": "$GITHUB_SHA",
            "build_number": "$GITHUB_RUN_NUMBER",
            "branch": "$GITHUB_REF_NAME",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          # --no-web-resources-cdn：把 CanvasKit 放进自己的 build/web/canvaskit/。
          # 预设会从 www.gstatic.com 载入，那条路径 service worker 不能快取
          # （gstatic.com 在 never-cache 名单里），cache_sw.js 的 vendor cache
          # 也就永远不会命中。改成自家来源后引擎才真的能离线与跨 deploy 重用。
          #
          # 这里刻意「不」加 --wasm。瓶颈虽然确实在 UI thread（执行 Dart 本身），
          # 但 Flutter 的 wasm 版在 iOS 上根本跑不起来：Safari 18.2 起虽已支援
          # WasmGC，WebKit 仍有一个 bug 挡住 Flutter 的 wasm 渲染器
          # （https://bugs.webkit.org/show_bug.cgi?id=267291），而 iOS 上所有
          # 浏览器都被规定使用 WebKit，换 Chrome 也一样。实测 HUD 显示 iPhone
          # 上落回 JS 版，证实了这点。我们的使用者以 iPhone 为主，加了只会让
          # artifact 变两份、CI 变慢，却换不到任何东西。
          # 上游修好之后把 --wasm 加回来即可（?perf=1 的 HUD 会显示 WASM/JS）。
          flutter build web --release --base-href "/" --no-web-resources-cdn "${DART_DEFINES[@]}"

      # 6. 与 installer 共用 PWA staging／cache／Firebase SW 收尾。
      # BUILD_VERSION 每次 deploy 失效 App cache；VENDOR_VERSION 只跟 Flutter
      # 版本走，避免每次重抓 CanvasKit。工具遇到缺失／残留 placeholder 会停止。
      - name: Finalize web deployment
        run: |
          set -euo pipefail
          node scripts/finalize-web-deployment.mjs \
            --build build/web --staging .local/deployment \
            --firebase-config .local/firebase-config.json \
            --build-version "${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}" \
            --vendor-version "flutter-${FLUTTER_VERSION}"

      # Build from the staged copy, whose Worker settings match the Flutter
      # defines and generated rules. Only the _worker.js/ module directory is deployed, not config files.
      - name: Build Pages Functions
        run: npx --yes wrangler@4 pages functions build .local/deployment/functions --outdir=build/web/_worker.js

      # 8. 部署到 Cloudflare Pages
      # cloudflare/pages-action@v1 已被官方 deprecate（repo 已封存），
      # 改用 wrangler-action 跑 `pages deploy`。API token 权限需求相同
      # （Cloudflare Pages: Edit）。
      # 关键：推送到 main 会更新 Production，推送到 dev 会产生 Preview 网址
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: >-
            npx wrangler pages project create
            ${{ secrets.CLOUDFLARE_PAGES_PROJECT || vars.CLOUDFLARE_PAGES_PROJECT }}
            --production-branch=main || true
          command: >-
            pages deploy build/web
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT || vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
