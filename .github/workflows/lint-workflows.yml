name: Lint workflows

# 为什么要独立成一个档案：workflow 一旦有语法错误，GitHub 就整份载入不了、
# 零个 job 执行 —— 把检查放在 deploy-flutter-pwa.yml 里面等于自己坏掉时自己
# 也不会跑。放在别的档案，deploy 那份坏掉时这份还在，会红灯报出原因。
#
# 实际发生过：deploy-flutter-pwa.yml 的一段中文注解里写出了表示式的双大括号
# 语法（在解释「不要用表示式插值」），GitHub 扫描整份档案（含 run: 区块内部）
# 解析表示式时遇到空的一组就是语法错误，整个 workflow 没有载入。本机的
# yaml.safe_load、bash -n、schema 检查全部抓不到，因为那是 GitHub 的表示式层。
# actionlint 抓得到。

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

# 版本固定 + 对 checksum：这支 binary 会在能读到 repo 的 runner 上执行，
# 不验证等于信任下载当下的 GitHub Releases 没被动过手脚。
env:
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          # 注解不能以 shellcheck 那个字当开头 —— 那是它的指示词语法，
          # 会被当成 directive 去解析然后报 SC1072/SC1073。（这行原本就是
          # 这样写坏的，正好被这支 linter 自己抓到。）
          #
          # runner 内建了 shellcheck，所以 actionlint 会连 run: 区块里的
          # shell 一起检查；本机没装时它是静静跳过而不是失败，本机全绿不代表
          # CI 会过。
          ./actionlint -color
