# 建置参数从同目录的 .env 读（照 .env.example 建立）。
# Firebase 设定必须在 build 时就注入，执行期没有机会补。
#
# Firebase.initializeApp 的必填栏位在这里就用 :? 挡掉，清单与 Dockerfile 内
# 的检查一致。Dockerfile 那道防线是最后保险，但它要等 clone Flutter SDK、
# pub get、COPY 都跑完才轮到 —— 少填一个值却要等好几分钟才看到错误讯息。
# 在 compose 这层挡等于秒回。
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CHURCH_CONFIG_JSON: ${CHURCH_CONFIG_JSON:?CHURCH_CONFIG_JSON is required (public church configuration JSON)}
        FCM_WEB_VAPID_KEY: ${FCM_WEB_VAPID_KEY:-}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:?FIREBASE_API_KEY is required}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:?FIREBASE_AUTH_DOMAIN is required}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:?FIREBASE_MESSAGING_SENDER_ID is required}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:?FIREBASE_APP_ID is required}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
        GOOGLE_CALENDAR_API_KEY: ${GOOGLE_CALENDAR_API_KEY:-}
        GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
    image: church-staff-pwa:latest
    container_name: church_staff_pwa
    restart: unless-stopped
    ports:
      - "8787:80"
